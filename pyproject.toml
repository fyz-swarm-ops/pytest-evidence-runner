[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-evidence-runner"
version = "0.1.1"
description = "Run Python test commands and produce evidence-backed verification reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joshua Backing" }]
keywords = ["pytest", "verification", "qa", "docker", "evidence", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=8,<9"]

[project.optional-dependencies]
dev = ["ruff>=0.7,<1"]

[project.scripts]
pytest-evidence = "pytest_evidence_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_evidence_runner = ["docker_context/Dockerfile"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
